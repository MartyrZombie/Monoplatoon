name: CI

# Every push to develop, and every pull request, builds the full print set so a
# broken script never reaches main. The build output is kept as a workflow
# artifact for 14 days so you can download and proof it before merging.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-branch:
    name: Only develop merges into main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (this one is from '${{ github.head_ref }}'). Merge your branch into develop first."
            exit 1
          fi
          echo "Source branch is develop. OK."

  build:
    name: Build print files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Check page counts
        run: |
          python - <<'PY'
          import sys
          from pypdf import PdfReader
          expected = {
              'Monoplatoon_Phase1_Board_Stickers.pdf': 6,
              'Monoplatoon_Phase2_Decks.pdf': 8,
              'Monoplatoon_Phase3_Characters_and_Deeds.pdf': 10,
              'Monoplatoon_Phase4_Table_Pieces.pdf': 24,
              'Monoplatoon_Phase5_Rulebook.pdf': 7,
              'Monoplatoon_Complete_Print_Set.pdf': 55,
          }
          bad = 0
          for name, want in expected.items():
              got = len(PdfReader('dist/' + name).pages)
              print(f'{name}: {got} pages (expected {want})')
              if got != want:
                  print(f'::error::{name} has {got} pages, expected {want}')
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Upload proof build
        uses: actions/upload-artifact@v5
        with:
          name: monoplatoon-proof-${{ github.sha }}
          path: dist/
          retention-days: 14
