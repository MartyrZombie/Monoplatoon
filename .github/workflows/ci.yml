name: CI

# Every push to develop, and every pull request, builds the full print set so a
# broken script never reaches main. The build output is kept as a workflow
# artifact for 14 days so you can download and proof it before merging.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-branch:
    name: Only develop merges into main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (this one is from '${{ github.head_ref }}'). Merge your branch into develop first."
            exit 1
          fi
          echo "Source branch is develop. OK."

  build:
    name: Build print files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Check page counts
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          check() { n=$(pdfinfo "dist/$1" | awk '/^Pages:/{print $2}'); echo "$1: $n pages"; [ "$n" = "$2" ] || { echo "::error::$1 has $n pages, expected $2"; exit 1; }; }
          check Monoplatoon_Phase1_Board_Stickers.pdf 6
          check Monoplatoon_Phase2_Decks.pdf 8
          check Monoplatoon_Phase3_Characters_and_Deeds.pdf 10
          check Monoplatoon_Phase4_Table_Pieces.pdf 24
          check Monoplatoon_Phase5_Rulebook.pdf 7
          check Monoplatoon_Complete_Print_Set.pdf 55

      - name: Upload proof build
        uses: actions/upload-artifact@v4
        with:
          name: monoplatoon-proof-${{ github.sha }}
          path: dist/
          retention-days: 14
