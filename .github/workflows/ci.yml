name: CI

# Every push to develop, and every pull request, builds the full print set so a
# broken script never reaches main. Design rules and page counts are checked by
# the separate Quality check workflow (qa.yml). The build output is kept as a workflow
# artifact for 14 days so you can download and proof it before merging.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-branch:
    name: Only develop merges into main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (this one is from '${{ github.head_ref }}'). Merge your branch into develop first."
            exit 1
          fi
          echo "Source branch is develop. OK."

  build:
    name: Build print files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Upload proof build
        uses: actions/upload-artifact@v6
        with:
          name: monoplatoon-proof-${{ github.sha }}
          path: dist/
          retention-days: 14
